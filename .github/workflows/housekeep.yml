name: housekeep

# Manual run: Actions tab -> housekeep -> Run workflow (works without any inputs)
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rivernet-housekeep
  cancel-in-progress: false

jobs:
  housekeep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run housekeeping
        run: python housekeep.py

      - name: Commit and push
        run: |
          git config user.name "rivernet-archive[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data archive state
          if ! git diff --cached --quiet; then
            git commit -m "housekeep: archive $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "nothing to archive"
          fi
